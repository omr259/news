<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>أخبار | NEWS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080d18;--p:#101827;--p2:#162236;--ln:#243248;--tx:#edf3fb;--mu:#91a0b5;--b:#4c9dff;--c:#54d6df;--g:#f2c879;--r:#ff667b}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65;min-height:100vh;
background-image:radial-gradient(420px 300px at 90% -40px,rgba(76,157,255,.22),transparent 70%),radial-gradient(380px 300px at 0% 120px,rgba(84,214,223,.14),transparent 70%),radial-gradient(360px 280px at 100% 70%,rgba(242,200,121,.08),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 30px}
.badge{display:flex;justify-content:center;margin:12px 0 4px}
.badge span{display:inline-block;padding:4px 20px;border-radius:999px;font-weight:800;font-size:14.5px;letter-spacing:.3px;color:#16120a;background:linear-gradient(90deg,#f2c879,#ffe3a6,#f2c879);box-shadow:0 2px 14px rgba(242,200,121,.35)}
.badge.end{margin:26px 0 0}
.badge.end span{color:var(--tx);background:linear-gradient(90deg,rgba(76,157,255,.35),rgba(84,214,223,.35));border:1px solid rgba(84,214,223,.6);box-shadow:0 2px 16px rgba(84,214,223,.25)}
header{position:sticky;top:0;z-index:6;background:rgba(8,13,24,.96);padding:6px 0 8px;display:flex;align-items:center;gap:8px}
.brand{flex:1;font-weight:800;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:12px;min-width:42px;height:42px;font:inherit;font-weight:700;cursor:pointer;padding:0 10px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.ib:active,.chip:active,.btn:active{transform:scale(.96)}
.ib,.chip,.btn{transition:transform .12s}
.line{height:2px;background:linear-gradient(90deg,var(--b),var(--c),var(--g),var(--r),var(--b));background-size:300% 100%;animation:slide 9s linear infinite;border-radius:2px}
@keyframes slide{to{background-position:300% 0}}
.srch{display:flex;gap:8px;margin:12px 0 8px}
.srch input{flex:1;min-width:0;background:var(--p);border:1px solid var(--ln);border-radius:12px;color:var(--tx);padding:10px 12px;font:inherit;font-size:15px}
.srch input:focus{outline:2px solid var(--b)}
.upd{color:var(--mu);font-size:12.5px;margin:2px 2px 8px}
.upd i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#63d5a1;margin-inline-end:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--p);color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{color:#06121f;border-color:transparent;background:linear-gradient(90deg,var(--b),var(--c))}
.card{display:block;background:var(--p);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-bottom:14px;animation:up .3s ease both;animation-delay:calc(var(--i,0)*30ms);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card .im{position:relative;display:block;aspect-ratio:16/9;background:linear-gradient(135deg,var(--p2),#1e3350)}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .im .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--c);font-weight:800;font-size:44px;opacity:.7}
.card .im .sh{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,transparent,rgba(16,24,39,.9))}
.card .bd{display:block;padding:12px 14px 14px}
.card h3{margin:2px 0 6px;font-size:18px;line-height:1.55;font-weight:800}
.card p{margin:0 0 10px;color:#cfd9e8;font-size:15.5px;line-height:1.8}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 10px;border-radius:999px;background:linear-gradient(90deg,var(--g),#ffd98e);color:#1b1405;margin-inline-end:6px}
.tag.c{background:rgba(84,214,223,.16);color:var(--c);border:1px solid rgba(84,214,223,.4)}
.src{color:var(--mu);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row .btn{flex:1;text-align:center;padding:9px 14px}
.row .btn.alt{flex:none;min-width:48px}
.sk{height:92px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--p),var(--p2),var(--p));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{color:var(--mu);text-align:center;padding:24px 8px}
.more{display:block!important;margin:6px auto 0}
.btn{background:linear-gradient(90deg,var(--b),var(--c));color:#06121f;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--p2);color:var(--tx);border:1px solid var(--ln)}
.fv{font-size:18px}
@media (prefers-reduced-motion:reduce){.card,.line,.sk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="badge"><span>عمر ابراهيم محمد</span></div>
<header>
<div class="brand">NEWS</div>
<button class="ib" id="fvb" aria-label="fav">☆</button>
<button class="ib" id="snd" aria-label="sound">🔊</button>
<button class="ib" id="lg">EN</button>
<a class="ib" href="https://omr259.github.io" aria-label="home">⌂</a>
</header>
<div class="line"></div>
<div class="srch"><input id="q" type="search" autocomplete="off"></div>
<div class="upd" id="upd"></div>
<div class="chips" id="chips"></div>
<div id="main"></div>
<div class="badge end"><span>عبدالجيد</span></div>
</div>
<script>
var CATS=["all","egypt","world","business","tech","sport","culture"];
var TX={ar:{all:"الكل",egypt:"مصر",world:"العالم",business:"اقتصاد",tech:"تكنولوجيا",sport:"رياضة",culture:"ثقافة",ph:"ابحث في الأخبار...",upd:"آخر تحديث",every:"بيتحدث تلقائيًا كل 6 ساعات",none:"مفيش أخبار هنا دلوقتي",err:"الأخبار لسه متجهزتش. استنى دقيقتين وحدّث الصفحة.",more:"عرض المزيد",open:"افتح الخبر",save:"حفظ",saved:"محفوظ",close:"إغلاق",fav:"المحفوظات",favnone:"مفيش أخبار محفوظة",top:"أهم خبر",share:"مشاركة",by:"المصدر"},
en:{all:"All",egypt:"Egypt",world:"World",business:"Business",tech:"Tech",sport:"Sports",culture:"Culture",ph:"Search news...",upd:"Last update",every:"auto-updates every 6 hours",none:"No stories here right now",err:"News is not ready yet. Wait two minutes and refresh.",more:"Show more",open:"Open story",save:"Save",saved:"Saved",close:"Close",fav:"Saved",favnone:"No saved stories",top:"Top story",share:"Share",by:"Source"}};
var L=localStorage.getItem("nl")||"ar",muted=localStorage.getItem("nm")=="1",cat="all",favOnly=false,term="",shown=24,DATA=null;
var FAV=[];try{FAV=JSON.parse(localStorage.getItem("nf")||"[]")}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:"#"}
var AC=null;
function tone(seq,type,vol,gap){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();var t=AC.currentTime;seq.forEach(function(n,i){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=n;var s=t+i*(gap||.08);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.015);g.gain.exponentialRampToValueAtTime(0.0001,s+.15);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.17)})}catch(e){}}
function sTap(){tone([560],"sine",.16)}
function sIn(){tone([660,990],"sine",.18)}
function sOut(){tone([420,280],"triangle",.2)}
function ago(iso){var m=(Date.now()-new Date(iso).getTime())/60000;if(isNaN(m))return"";var r=new Intl.RelativeTimeFormat(L,{numeric:"auto"});
 if(m<60)return r.format(-Math.max(1,Math.round(m)),"minute");if(m<1440)return r.format(-Math.round(m/60),"hour");return r.format(-Math.round(m/1440),"day")}
function items(){var a=(DATA&&DATA[L])||[];
 if(favOnly)a=a.filter(function(x){return FAV.indexOf(x.l)>=0});
 else if(cat!="all")a=a.filter(function(x){return x.c==cat});
 if(term){var t=term.toLowerCase();a=a.filter(function(x){return (x.t+" "+x.d).toLowerCase().indexOf(t)>=0})}
 return a}
function thumb(x){return x.i?'<img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="'+esc(x.i)+'" onerror="this.remove()">':esc((x.s||"N").charAt(0))}
var cur=[];
function render(){
 var t=TX[L];document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 $("lg").textContent=L=="ar"?"EN":"ع";$("snd").textContent=muted?"🔇":"🔊";$("fvb").textContent=favOnly?"★":"☆";$("q").placeholder=t.ph;
 $("chips").innerHTML=CATS.map(function(c){return'<button class="chip'+(!favOnly&&cat==c?" on":"")+'" data-c="'+c+'">'+t[c]+"</button>"}).join("");
 if(DATA&&DATA.updated){var d=new Date(DATA.updated);var s=new Intl.DateTimeFormat(L=="ar"?"ar-EG":"en-GB",{timeZone:"Africa/Cairo",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(d);$("upd").innerHTML="<i></i>"+t.upd+": "+s+" · "+t.every}else $("upd").textContent="";
 var m=$("main");
 if(!DATA){m.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';return}
 if(DATA==="err"){m.innerHTML='<div class="msg">'+t.err+"</div>";return}
 cur=items();
 if(!cur.length){m.innerHTML='<div class="msg">'+(favOnly?t.favnone:t.none)+"</div>";return}
 var h="";
 for(var k=0;k<Math.min(cur.length,shown);k++){var y=cur[k],on=FAV.indexOf(y.l)>=0;
  h+='<article class="card" style="--i:'+Math.min(k,8)+'"><span class="im">'+(y.i?'<img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="'+esc(y.i)+'" onerror="this.remove()">':'<span class="ph">'+esc((y.s||"N").charAt(0))+"</span>")+'<span class="sh"></span></span><span class="bd">'+
  '<span>'+(k==0&&!favOnly&&!term&&cat=="all"?'<span class="tag">'+t.top+"</span>":"")+'<span class="tag c">'+t[y.c]+'</span></span><h3>'+esc(y.t)+"</h3>"+(y.d?"<p>"+esc(y.d)+"</p>":"")+
  '<span class="src">'+esc(y.s)+" · "+ago(y.p)+'</span><span class="row"><a class="btn go" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(y.l))+'">'+t.open+'</a><button class="btn alt sv" data-l="'+esc(y.l)+'" aria-label="save">'+(on?"★":"☆")+"</button></span></span></article>"}
 if(cur.length>shown)h+='<button class="btn alt more" id="more">'+t.more+"</button>";
 m.innerHTML=h;
}
document.addEventListener("click",function(e){
 var c=e.target.closest(".chip");if(c){sTap();favOnly=false;cat=c.getAttribute("data-c");shown=24;render();return}
 if(e.target.id=="more"){sTap();shown+=24;render();return}
 if(e.target.closest(".go")){sIn();return}
 var v=e.target.closest(".sv");if(v){sTap();var l=v.getAttribute("data-l"),i=FAV.indexOf(l);if(i>=0)FAV.splice(i,1);else FAV.push(l);localStorage.setItem("nf",JSON.stringify(FAV));
  if(favOnly){render()}else v.textContent=FAV.indexOf(l)>=0?"★":"☆";return}
});
$("fvb").onclick=function(){sTap();favOnly=!favOnly;shown=24;render()};
$("lg").onclick=function(){L=L=="ar"?"en":"ar";localStorage.setItem("nl",L);shown=24;sTap();render()};
$("snd").onclick=function(){muted=!muted;localStorage.setItem("nm",muted?"1":"0");sTap();render()};
$("q").addEventListener("input",function(){term=this.value.trim();shown=24;render()});
fetch("news.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;render()}).catch(function(){DATA="err";render()});
render();
</script>
</body>
</html>
